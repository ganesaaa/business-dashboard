<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f14;
      color: #f5f7fa;
      min-height: 100vh;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #11161d;
      border-right: 1px solid #202731;
      padding: 24px 16px;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      padding: 0 12px 30px;
    }

    .logo span {
      color: #4ade80;
    }

    .nav-title {
      font-size: 11px;
      color: #6b7280;
      text-transform: uppercase;
      padding: 0 12px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #9ca3af;
      padding: 12px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      transition: .2s;
    }

    .nav button:hover,
    .nav button.active {
      background: #1b242f;
      color: white;
    }

    .nav button.active {
      color: #4ade80;
    }

    /* MAIN */
    .main {
      margin-left: 240px;
      width: calc(100% - 240px);
      padding: 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .topbar p {
      color: #7f8a99;
      font-size: 13px;
      margin-top: 6px;
    }

    .status {
      background: #14251b;
      border: 1px solid #21452c;
      color: #4ade80;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #11161d;
      border: 1px solid #202731;
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      color: #7f8a99;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .card-value {
      font-size: 25px;
      font-weight: 700;
    }

    .positive {
      color: #4ade80;
    }

    .negative {
      color: #f87171;
    }

    /* CONTENT */
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .panel {
      background: #11161d;
      border: 1px solid #202731;
      border-radius: 12px;
      padding: 20px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      font-size: 16px;
    }

    .panel-header span {
      font-size: 12px;
      color: #6b7280;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      color: #6b7280;
      font-size: 11px;
      text-transform: uppercase;
      padding: 10px 8px;
      border-bottom: 1px solid #202731;
    }

    td {
      padding: 14px 8px;
      border-bottom: 1px solid #1b222b;
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 35px 0;
    }

    /* QUICK ACTION */
    .actions {
      display: grid;
      gap: 10px;
    }

    .action {
      background: #171d25;
      border: 1px solid #252d38;
      color: #d1d5db;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: .2s;
    }

    .action:hover {
      border-color: #4ade80;
      color: white;
    }

    /* RESPONSIVE */
    @media (max-width: 1000px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 20px 8px;
      }

      .logo {
        font-size: 0;
        text-align: center;
      }

      .logo span {
        font-size: 20px;
      }

      .nav-title {
        display: none;
      }

      .nav button {
        text-align: center;
        font-size: 0;
      }

      .nav button::first-letter {
        font-size: 18px;
      }

      .main {
        margin-left: 70px;
        width: calc(100% - 70px);
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo">
        Business<span>OS</span>
      </div>

      <div class="nav-title">Menu</div>

      <div class="nav">
        <button class="active" onclick="showPage('Dashboard', this)">
          📊 Dashboard
        </button>

        <button onclick="showPage('Stock', this)">
          📦 Stock
        </button>

        <button onclick="showPage('Sales', this)">
          💰 Sales
        </button>

        <button onclick="showPage('Expenses', this)">
          💸 Expenses
        </button>

        <button onclick="showPage('Accounts', this)">
          👤 Accounts
        </button>
      </div>
    </aside>


    <!-- MAIN -->
    <main class="main">

      <div class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p>Overview bisnis kamu</p>
        </div>

        <div class="status">
          ● System Online
        </div>
      </div>


      <!-- STAT CARDS -->
      <section class="cards">

        <div class="card">
          <div class="card-label">Total Sales</div>
          <div class="card-value" id="totalSales">
            $0.00
          </div>
        </div>

        <div class="card">
          <div class="card-label">Total Expenses</div>
          <div class="card-value negative" id="totalExpenses">
            $0.00
          </div>
        </div>

        <div class="card">
          <div class="card-label">Profit</div>
          <div class="card-value positive" id="totalProfit">
            $0.00
          </div>
        </div>

        <div class="card">
          <div class="card-label">Stock Value</div>
          <div class="card-value" id="stockValue">
            Rp0
          </div>
        </div>

      </section>


      <!-- CONTENT -->
      <section class="grid">

        <div class="panel">

          <div class="panel-header">
            <h2>Recent Sales</h2>
            <span>Latest transactions</span>
          </div>

          <table>

            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Date</th>
              </tr>
            </thead>

            <tbody id="salesTable">

              <tr>
                <td colspan="4" class="empty">
                  Belum ada transaksi
                </td>
              </tr>

            </tbody>

          </table>

        </div>


        <div class="panel">

          <div class="panel-header">
            <h2>Quick Actions</h2>
          </div>

          <div class="actions">

            <button class="action">
              + Add Stock
            </button>

            <button class="action">
              + Add Sale
            </button>

            <button class="action">
              + Add Expense
            </button>

            <button class="action">
              + Add Account
            </button>

          </div>

        </div>

      </section>

    </main>

  </div>


  <script>

    function showPage(page, button) {

      document.getElementById("pageTitle").textContent = page;

      document.querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

    }

  </script>

</body>
</html>
